plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.yuuki.poirot'
    enableKotlin false
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.yuuki.poirot"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packagingOptions {
        resources {
            excludes += [
                    'META-INF/com/android/build/gradle/app-metadata.properties',
                    'META-INF/version-control-info.textproto',
                    'kotlin/**',
                    '**/*.kotlin_builtins'
            ]
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {

}
